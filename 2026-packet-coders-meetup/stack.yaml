version: "1"
name: packet-coders

gateway:
  name: packet-coders
  bind: "0.0.0.0"
  allowed_hosts:
    - "172.16.10.10"
  insecure_allow_unauthenticated: true

  # code_mode: "on"
  # output_format: toon

network:
  name: packet-coders
  driver: bridge

link:
  - client: opencode
    client_id: opencode
  - client: claude-code
    client_id: claude-code

mcp-servers:

  - name: time
    image: mcp/time@sha256:9c46a918633fb474bf8035e3ee90ebac6bcf2b18ccb00679ac4c179cba0ebfcf
    transport: stdio
    protocol_generation: handshake
    command: [--local-timezone=UTC]

